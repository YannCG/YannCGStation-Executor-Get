<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Particle Background -->
    <div id="particles-js"></div>

    <header>
        <div class="container">
            <h1>SpaceX</h1>
            <div class="language-switcher">
                <button onclick="changeLanguage('en')" class="lang-btn" data-lang="en">EN</button>
                <button onclick="changeLanguage('fr')" class="lang-btn" data-lang="fr">FR</button>
                <button onclick="changeLanguage('zh')" class="lang-btn" data-lang="zh">中</button>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <!-- Hero Section -->
            <section id="hero">
                <div class="hero-content">
                    <h2 data-key="hero.title"></h2>
                    <p data-key="hero.subtitle"></p>
                </div>
                <div class="hero-visual">
                    <!-- Falcon 9 silhouette or animation would go here -->
                    <div class="rocket-silhouette"></div>
                </div>
            </section>

            <!-- Achievements Section -->
            <section id="achievements">
                <h2 data-key="achievements.title"></h2>
                <div class="tech-grid">
                    <div class="tech-card" data-key="achievements.falcon9.title">
                        <div class="tech-icon">🚀</div>
                        <h3>Falcon 9</h3>
                        <p data-key="achievements.falcon9.content"></p>
                    </div>
                    <div class="tech-card" data-key="achievements.dragon.title">
                        <div class="tech-icon">🐉</div>
                        <h3>Dragon</h3>
                        <p data-key="achievements.dragon.content"></p>
                    </div>
                    <div class="tech-card" data-key="achievements.starship.title">
                        <div class="tech-icon">⭐</div>
                        <h3>Starship</h3>
                        <p data-key="achievements.starship.content"></p>
                    </div>
                </div>
            </section>

            <!-- Publications/Research Section -->
            <section id="publications">
                <h2 data-key="publications.title"></h2>
                <div class="publications-grid">
                    <div class="pub-card" data-key="pub1.title">
                        <div class="pub-icon">📄</div>
                        <h3>Reusable Launch Systems</h3>
                        <p data-key="pub1.content"></p>
                        <a href="#" class="pub-link" data-key="pub1.link">View Paper</a>
                    </div>
                    <div class="pub-card" data-key="pub2.title">
                        <div class="pub-icon">📊</div>
                        <h3>Mars Habitat Design</h3>
                        <p data-key="pub2.content"></p>
                        <a href="#" class="pub-link" data-key="pub2.link">View Paper</a>
                    </div>
                    <div class="pub-card" data-key="pub3.title">
                        <div class="pub-icon">🔬</div>
                        <h3>Propulsion Technology</h3>
                        <p data-key="pub3.content"></p>
                        <a href="#" class="pub-link" data-key="pub3.link">View Paper</a>
                    </div>
                    <div class="pub-card" data-key="pub4.title">
                        <div class="pub-icon">📡</div>
                        <h3>Communications Systems</h3>
                        <p data-key="pub4.content"></p>
                        <a href="#" class="pub-link" data-key="pub4.link">View Paper</a>
                    </div>
                </div>
            </section>

            <!-- Mission Section -->
            <section id="mission">
                <h2 data-key="future.title"></h2>
                <div class="mission-visual">
                    <div class="mars-colony"></div>
                    <p data-key="future.content"></p>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p data-key="footer.text"></p>
            <div class="footer-decoration"></div>
        </div>
    </footer>

    <!-- Particles JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
